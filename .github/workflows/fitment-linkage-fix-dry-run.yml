name: AI Fitment Linkage Fix Dry Run

on:
  workflow_dispatch:
  push:
    branches:
      - ai-fitment-linkage-fix
    paths:
      - tools/enrich_ai_fitment_backlog.py
      - tools/enrich_ai_fitment_backlog_safe.py
      - tools/backfill_fitment_summary_to_ai_feed.py
      - tests/test_ai_fitment_linkage.py
      - .github/workflows/fitment-linkage-fix-dry-run.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: ai-fitment-linkage-fix-dry-run
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/127233897104/locations/global/workloadIdentityPools/elkady-github-actions/providers/github
          service_account: elkady-crm-automation@elkadyauto-login.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Unit tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_ai_fitment_linkage.py
      - name: Scan unresolved enrichment queue
        env:
          ELKADY_SPREADSHEET_ID: 1A-8YoZkVIdelh2x3i7DmeFCERLeR1XREyEpK3Wrk6B0
        run: python tools/enrich_ai_fitment_backlog_safe.py --scan-only --max-items 3 --max-brands 3
      - name: Dry-run verified fitment propagation
        env:
          ELKADY_SPREADSHEET_ID: 1A-8YoZkVIdelh2x3i7DmeFCERLeR1XREyEpK3Wrk6B0
        run: python tools/backfill_fitment_summary_to_ai_feed.py --report automation_output/verified_fitment_backfill_dry_run.json
      - uses: actions/upload-artifact@v4
        with:
          name: ai-fitment-linkage-fix-dry-run-${{ github.run_id }}
          path: automation_output/
          retention-days: 14
