name: AI Fitment Backlog Test

on:
  push:
    branches:
      - ai-complete-backfill
    paths:
      - tools/enrich_ai_fitment_backlog.py
      - .github/workflows/ai-fitment-backlog-test.yml

permissions:
  contents: read
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/127233897104/locations/global/workloadIdentityPools/elkady-github-actions/providers/github
          service_account: elkady-crm-automation@elkadyauto-login.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt || pip install requests beautifulsoup4 google-api-python-client google-auth
      - name: Scan backlog only
        env:
          ELKADY_SPREADSHEET_ID: 1A-8YoZkVIdelh2x3i7DmeFCERLeR1XREyEpK3Wrk6B0
        run: python tools/enrich_ai_fitment_backlog.py --scan-only
      - uses: actions/upload-artifact@v4
        with:
          name: ai-fitment-backlog-test-report
          path: automation_output/ai_fitment_backlog_report.json
          retention-days: 7
