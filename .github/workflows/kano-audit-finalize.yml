name: KANO Audit Finalize
on:
  workflow_run:
    workflows: ["KANO Audit Completion"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: supplier-sheet-auto-trigger
  cancel-in-progress: false
jobs:
  finalize:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/127233897104/locations/global/workloadIdentityPools/elkady-github-actions/providers/github
          service_account: elkady-crm-automation@elkadyauto-login.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests beautifulsoup4 google-api-python-client google-auth
      - uses: actions/download-artifact@v4
        with:
          name: kano-audit-completion-${{ github.event.workflow_run.id || '40485553207' }}
          run-id: ${{ github.event.workflow_run.id || '40485553207' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: kano_finalize_input/latest
      - name: Download earlier water-pump evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: kano-audit-completion-40484928421
          run-id: 40484928421
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: kano_finalize_input/prior
      - name: Recheck source-photo air suspension descriptions
        env:
          ELKADY_SPREADSHEET_ID: 1A-8YoZkVIdelh2x3i7DmeFCERLeR1XREyEpK3Wrk6B0
        shell: bash
        run: |
          for prefix in OFF-KANO-XMATCH-20261027-C029 OFF-KANO-XMATCH-20261027-C030; do
            python tools/process_new_supplier_rows.py --baseline-row 2040 --max-candidates 1 --max-catalogs 1 --offer-prefix "$prefix" --reprocess
            if [ -d supplier_sheet_trigger_output ]; then
              while IFS= read -r -d '' payload; do
                python tools/relink_supplier_master_product.py --payload "$payload"
              done < <(find supplier_sheet_trigger_output -name import_payload.json -print0)
            fi
          done
      - name: Store exact OEM review evidence
        env:
          ELKADY_SPREADSHEET_ID: 1A-8YoZkVIdelh2x3i7DmeFCERLeR1XREyEpK3Wrk6B0
        run: python tools/finalize_kano_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: kano-audit-finalize-report
          path: kano_finalize_report.json
          retention-days: 7
