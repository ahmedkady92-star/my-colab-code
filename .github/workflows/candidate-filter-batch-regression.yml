name: Candidate Filter Batch Regression

on:
  push:
    branches:
      - fix-sheets-batch-fitment-upsert
    paths:
      - supplier_automation.py
      - cars245_fitment_enrich.py
      - tools/cars245_result_gate.py
      - tools/upsert_verified_fitment.py
      - tools/test_candidate_filter_batch.py
      - .github/workflows/candidate-filter-batch-regression.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests beautifulsoup4
      - run: python tools/test_candidate_filter_batch.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-filter-batch-report
          path: candidate_filter_test_output/
          if-no-files-found: ignore
          retention-days: 7
