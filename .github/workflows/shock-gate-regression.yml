name: Shock Gate Regression

on:
  push:
    branches:
      - fix-shock-family-gate
    paths:
      - supplier_automation.py
      - tools/cars245_result_gate.py
      - tools/test_shock_gate.py
      - .github/workflows/shock-gate-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas requests beautifulsoup4
      - name: Run isolated shock gate regression
        run: python tools/test_shock_gate.py
      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shock-gate-regression-report
          path: shock_gate_test_output/
          if-no-files-found: ignore
          retention-days: 7
