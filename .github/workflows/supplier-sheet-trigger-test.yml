name: Supplier Sheet Trigger Test

on:
  push:
    branches:
      - wif-sheets-live-test
    paths:
      - tools/process_new_supplier_rows.py
      - tools/upsert_verified_fitment.py
      - tools/relink_supplier_master_product.py
      - .github/workflows/supplier-sheet-trigger-test.yml

permissions:
  contents: read
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/127233897104/locations/global/workloadIdentityPools/elkady-github-actions/providers/github
          service_account: elkady-crm-automation@elkadyauto-login.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas requests beautifulsoup4 google-api-python-client google-auth
      - name: Scan only after safe baseline
        env:
          ELKADY_SPREADSHEET_ID: 1A-8YoZkVIdelh2x3i7DmeFCERLeR1XREyEpK3Wrk6B0
        run: python tools/process_new_supplier_rows.py --baseline-row 1229 --scan-only
