name: Cars245 Test

on:
  workflow_dispatch:
    inputs:
      part_number:
        description: "Part number to test"
        required: true
        default: "4F0 413 031 AL"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cars245-test.yml"
      - "cars245_strict.py"

jobs:
  scrape-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TEST_PART: ${{ github.event_name == 'workflow_dispatch' && inputs.part_number || '4F0 413 031 AL' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run strict Cars245 parser
        run: |
          echo "Testing part: $TEST_PART"
          python cars245_strict.py "$TEST_PART" --max-products 50 --delay 0.3 --output-dir output

      - name: Validate strict output
        run: |
          python - <<'PY'
          import glob, json, re
          files = glob.glob('output/*_strict.json')
          if not files:
              raise SystemExit('No strict JSON produced')
          r = json.load(open(files[0], encoding='utf-8'))
          print('product_links_found=', r['product_links_found'])
          print('alternatives_found=', r['alternatives_found'])
          print('fitment_rows_found=', r['fitment_rows_found'])
          print('oem_refs=', ' | '.join(r['oem_refs']))
          for x in r['alternatives']:
              print('ALT', x['brand'], x['part_number'], sep='\t')
          bad=[]
          for x in r['alternatives']:
              code=x['part_number']
              if re.search(r'\b(?:KW|HP)\b', code, re.I) or re.fullmatch(r'20\d{2}-20\d{2}', code):
                  bad.append(code)
          print('bad_alternative_codes=', bad)
          if bad:
              raise SystemExit('Strict parser still emitted obvious power/year false positives')
          PY

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: cars245-strict-test-report
          path: output/
