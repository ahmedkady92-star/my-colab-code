name: AI Fitment Backfill Dry Run

on:
  push:
    branches:
      - ai-fitment-backfill-all
    paths:
      - tools/backfill_fitment_summary_to_ai_feed.py
      - .github/workflows/ai-fitment-backfill-dry-run.yml

permissions:
  contents: read
  id-token: write

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/127233897104/locations/global/workloadIdentityPools/elkady-github-actions/providers/github
          service_account: elkady-crm-automation@elkadyauto-login.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-api-python-client google-auth
      - name: Dry run all AI fitment summaries
        env:
          ELKADY_SPREADSHEET_ID: 1A-8YoZkVIdelh2x3i7DmeFCERLeR1XREyEpK3Wrk6B0
        run: python tools/backfill_fitment_summary_to_ai_feed.py
      - uses: actions/upload-artifact@v4
        with:
          name: ai-fitment-backfill-dry-run-report
          path: automation_output/ai_fitment_backfill_report.json
          retention-days: 7
