name: Refresh CRM Intelligence Once

on:
  push:
    branches:
      - crm-intelligence-v1
    paths:
      - .github/workflows/refresh-crm-intelligence-once.yml

permissions:
  contents: read
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/127233897104/locations/global/workloadIdentityPools/elkady-github-actions/providers/github
          service_account: elkady-crm-automation@elkadyauto-login.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest google-api-python-client google-auth
      - name: Test
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_crm_intelligence.py
      - name: Refresh derived tabs
        env:
          ELKADY_SPREADSHEET_ID: 1A-8YoZkVIdelh2x3i7DmeFCERLeR1XREyEpK3Wrk6B0
        run: python tools/crm_intelligence.py --apply --output-dir crm_intelligence_refresh_output
      - uses: actions/upload-artifact@v4
        with:
          name: crm-intelligence-refresh-${{ github.run_id }}
          path: crm_intelligence_refresh_output/
          retention-days: 14
