name: AI Fitment Backlog Apply Test

on:
  push:
    branches:
      - ai-complete-backfill
    paths:
      - .github/workflows/ai-fitment-backlog-apply-test.yml

permissions:
  contents: read
  id-token: write

jobs:
  apply-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/127233897104/locations/global/workloadIdentityPools/elkady-github-actions/providers/github
          service_account: elkady-crm-automation@elkadyauto-login.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Process two backlog items
        env:
          ELKADY_SPREADSHEET_ID: 1A-8YoZkVIdelh2x3i7DmeFCERLeR1XREyEpK3Wrk6B0
        run: python tools/enrich_ai_fitment_backlog.py --max-items 2 --max-brands 5
      - uses: actions/upload-artifact@v4
        with:
          name: ai-fitment-backlog-apply-test-report
          path: automation_output/ai_fitment_backlog_report.json
          retention-days: 7
