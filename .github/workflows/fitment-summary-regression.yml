name: Fitment Summary Regression

on:
  push:
    branches:
      - sync-fitment-summary-to-ai-feed
    paths:
      - tools/sync_fitment_summary_to_ai_feed.py
      - tools/test_fitment_summary_to_ai_feed.py
      - .github/workflows/fitment-summary-regression.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/test_fitment_summary_to_ai_feed.py
